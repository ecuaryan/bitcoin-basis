name: Deploy

# Deploys to Cloudflare only after CI has succeeded for the exact commit.
#  - push to main (via CI's workflow_run) -> deploy that commit
#  - tag v* (via CI's workflow_run)       -> deploy it and attach dist-hashes.txt to a GitHub Release
#  - manual run with a ref (a tag to roll back to, or main) -> deploy that ref if CI passed for it
#
# Three jobs, so the Cloudflare token never shares a job with code from npm packages:
#  - plan:   decides whether and what to deploy (git and repo scripts only; no npm, no secrets)
#  - build:  npm ci --ignore-scripts, build, hash; uploads app/dist + dist-hashes.txt (no secrets)
#  - deploy: environment `production`. Installs the lockfile's pinned wrangler (--ignore-scripts, so no
#            package code runs at install), downloads the build, and gives CLOUDFLARE_API_TOKEN to the
#            wrangler step alone. Then smoke test and verify the live files.
# Skips with a notice when APP_ORIGIN or CLOUDFLARE_API_TOKEN is not set, so forks do not fail.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy (default: main). Use an older tag to roll back."
        required: false
        default: main
        type: string

permissions: {}

# One deploy at a time; a running deploy is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only successful CI runs of pushes in this repository (never a fork's pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')))
    permissions:
      contents: read
      actions: read # to look up whether CI passed for a manually chosen ref
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      deploy: ${{ steps.plan.outputs.deploy }}
      rp_id: ${{ steps.origin.outputs.rp_id }}
    steps:
      - name: Skip when the deployment is not configured
        if: env.APP_ORIGIN == ''
        run: echo "::notice::APP_ORIGIN is not configured; skipping deploy. See docs/deploy.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.APP_ORIGIN != ''
        with:
          # workflow_run: exactly the commit CI tested. Manual: the requested ref.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to deploy
        id: plan
        if: env.APP_ORIGIN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "$EVENT" = "workflow_run" ] && [ "$sha" != "$RUN_SHA" ]; then
            echo "::error::Checked out $sha, but CI ran on $RUN_SHA."
            exit 1
          fi
          # The commit a tag on origin points at (annotated tags peeled), or nothing.
          remote_tag_commit() {
            git ls-remote --tags origin \
              | awk -v t="refs/tags/$1" '$2 == t "^{}" { p = $1 } $2 == t { d = $1 } END { print (p != "" ? p : d) }'
          }
          is_remote_branch() {
            [ -n "$(git ls-remote --heads origin "refs/heads/$1")" ]
          }
          tag=""
          if [ "$EVENT" = "workflow_run" ]; then
            case "$RUN_BRANCH" in
              v*)
                # A release must be a real tag at exactly this commit. A *branch* named v* is refused, so
                # nobody can pass off a branch as a release (or skip the main-tip check with one).
                if is_remote_branch "$RUN_BRANCH"; then
                  echo "::error::'$RUN_BRANCH' is a branch. Releases deploy only from tags; branches named v* are refused."
                  exit 1
                fi
                if [ "$(remote_tag_commit "$RUN_BRANCH")" != "$sha" ]; then
                  echo "::error::refs/tags/$RUN_BRANCH does not exist or does not point at $sha. Not deploying."
                  exit 1
                fi
                tag="$RUN_BRANCH"
                ;;
            esac
          elif [ -n "$(remote_tag_commit "$INPUT_REF")" ]; then
            if is_remote_branch "$INPUT_REF"; then
              echo "::error::'$INPUT_REF' is both a tag and a branch. Rename the branch, then run again."
              exit 1
            fi
            if [ "$(remote_tag_commit "$INPUT_REF")" != "$sha" ]; then
              echo "::error::refs/tags/$INPUT_REF does not point at the checked-out commit $sha."
              exit 1
            fi
            tag="$INPUT_REF"
          fi
          git fetch --no-tags origin main
          main_tip="$(git rev-parse FETCH_HEAD)"
          deploy=true
          if ! git merge-base --is-ancestor "$sha" "$main_tip"; then
            echo "::error::$sha is not on main. Only commits on main are deployed."
            exit 1
          fi
          if [ "$EVENT" = "workflow_run" ] && [ -z "$tag" ] && [ "$sha" != "$main_tip" ]; then
            echo "::notice::$sha is no longer the tip of main; a newer commit will deploy instead."
            deploy=false
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            passed="$(gh run list --repo "$REPO" --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq length)"
            if [ "$passed" != "1" ]; then
              echo "::error::CI has not succeeded for $sha. Not deploying."
              exit 1
            fi
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $sha (tag: ${tag:-none}): $deploy"

      - name: Check the production origin
        id: origin
        if: steps.plan.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::GitHub variable CF_ACCOUNT_ID is not set."
            exit 1
          fi
          echo "rp_id=$(node tools/check-origin.mjs "$APP_ORIGIN")" >> "$GITHUB_OUTPUT"

  build:
    name: Build and hash (no secrets)
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build the app (with subresource integrity)
        run: npm run build
      - name: Hash the build
        run: node tools/hash-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: |
            app/dist
            dist-hashes.txt
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy and verify
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      # Only a yes/no here; the token itself is given to the wrangler step alone.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      WRANGLER_SEND_METRICS: "false"
    outputs:
      deployed: ${{ steps.deployed.outputs.deployed }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; skipping deploy. See docs/deploy.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
      - name: Install wrangler from the lockfile (no install scripts)
        if: env.HAS_TOKEN == 'true'
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_TOKEN == 'true'
        with:
          name: app-build
          path: .
      - name: Check the downloaded build
        if: env.HAS_TOKEN == 'true'
        run: test -f app/dist/index.html && test -f dist-hashes.txt

      - name: Deploy the Worker and app
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          RP_ID: ${{ needs.plan.outputs.rp_id }}
        # ORIGIN and RP_ID are always passed explicitly, so a deploy can never fall back to the localhost defaults.
        run: >-
          npx --no-install wrangler deploy --config worker/wrangler.jsonc
          --var "ORIGIN:${APP_ORIGIN}" --var "RP_ID:${RP_ID}"

      - name: Smoke test the live site
        if: env.HAS_TOKEN == 'true'
        run: node tools/smoke-test.mjs "$APP_ORIGIN" --retries 6
      - name: Verify the live files and headers match this build
        if: env.HAS_TOKEN == 'true'
        run: node tools/verify-deployment.mjs "$APP_ORIGIN" --hashes dist-hashes.txt --all --retries 6
      - name: Record the deploy
        id: deployed
        if: env.HAS_TOKEN == 'true'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  release:
    name: Attach hashes to the GitHub Release
    needs: [plan, deploy]
    if: needs.deploy.outputs.deployed == 'true' && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: .
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-hashes.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist-hashes.txt --repo "$REPO" --verify-tag --title "$TAG" \
              --notes "Build hashes for this release are in dist-hashes.txt. See docs/deploy.md to verify a deployment."
          fi
